server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: portfolio-hub
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/PORTAFOLIO}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  mail:
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  trust-proxy: ${APP_TRUST_PROXY:false}
  jwt:
    access-minutes: 15
    refresh-days: 7
  storage:
    path: ${APP_STORAGE_PATH:./data/storage}
    max-bytes: 15728640
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  clamav:
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
  analytics:
    retention-days: 365
